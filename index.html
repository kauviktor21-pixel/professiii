<head>

<title>Путеводитель по профессиям</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Russo+One&family=Comfortaa:wght@700&family=PT+Serif:wght@700&family=Playfair+Display:wght@700&family=Oswald:wght@600&family=Exo+2:wght@700&family=Caveat:wght@700&family=Rubik+Mono+One&family=Onest:wght@400;500&display=swap">
<style>
:root{--bg:#14161f;--ink:#f1f1f5;--acc:#ffd23f;--f:Unbounded,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 17px/1.6 Onest,system-ui,sans-serif;transition:background-color .3s,color .3s}
main{max-width:900px;margin:0 auto;padding:30px 18px 70px}
h1,h2,h3,.tile b{font-family:var(--f);line-height:1.15;margin:0}
h1{font-size:clamp(28px,7vw,46px)}
h2{font-size:clamp(26px,6vw,40px)}
h3{font-size:19px;margin:26px 0 12px;color:var(--acc)}
p{margin:0 0 12px;max-width:66ch}
.hidden{display:none}
input{width:100%;max-width:420px;padding:14px 16px;border:3px solid var(--acc);border-radius:12px;background:transparent;color:var(--ink);font:inherit;margin:20px 0 14px;display:block}
input::placeholder{color:var(--ink);opacity:.5}
button{cursor:pointer;border:0;border-radius:12px;padding:13px 22px;background:var(--acc);color:var(--bg);font:500 17px Onest,sans-serif}
button:hover{filter:brightness(1.1)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:24px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:18px;border-radius:16px;border:3px solid;min-height:150px;transition:transform .15s}
.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile i{font-style:normal;font-size:36px}
.tile b{font-size:17px}
.tile span{font-size:14px;opacity:.85}
.back{background:none;color:var(--ink);padding:0 0 20px;border-radius:0;opacity:.8}
.hero{font-size:72px;line-height:1;margin-bottom:14px}
.box{border:3px solid var(--acc);border-radius:16px;padding:4px 22px 22px;margin-top:22px;background:#ffffff0d}
.pros{padding-left:20px;margin:0}
.pros li{margin-bottom:8px}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:14px;margin-bottom:14px;align-items:flex-start}
.steps li:before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--bg);display:grid;place-items:center;font-weight:700}
.know p{margin-bottom:14px}
.know b{color:var(--acc)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<section id="s1">
<h1>Какая профессия твоя?</h1>
<p style="margin-top:14px;opacity:.8">Введи имя или ник, выбери профессию и узнай, что в ней крутого, с чего начать и что нужно знать.</p>
<input id="nick" placeholder="Твой ник" maxlength="24" autocomplete="off">
<button id="go">Войти</button>
</section>

<section id="s2" class="hidden">
<h2 id="hi"></h2>
<p style="margin-top:10px;opacity:.8">Выбирай профессию:</p>
<div class="grid" id="grid"></div>
</section>

<section id="s3" class="hidden">
<button class="back" id="back">← Все профессии</button>
<div class="hero" id="ico"></div>
<h2 id="t"></h2>
<p id="d" style="margin-top:16px;font-size:19px"></p>
<div class="box"><h3>Чем хороша</h3><ul class="pros" id="pros"></ul></div>
<div class="box"><h3>Где учиться</h3><p id="e" style="margin:0"></p></div>
<div class="box"><h3>С чего начать</h3><ol class="steps" id="steps"></ol></div>
<div class="box"><h3>База: что нужно знать</h3><div class="know" id="know"></div></div>
</section>
</main>

var PAT={
grid:function(a){return["linear-gradient("+a+"1f 1px,transparent 1px),linear-gradient(90deg,"+a+"1f 1px,transparent 1px)","34px 34px"]},
dots:function(a){return["radial-gradient("+a+"33 2px,transparent 2px)","24px 24px"]},
check:function(a){return["conic-gradient("+a+"14 25%,transparent 0 50%,"+a+"14 0 75%,transparent 0)","44px 44px"]},
diag:function(a){return["repeating-linear-gradient(45deg,"+a+"14 0 12px,transparent 12px 24px)","auto"]},
diag2:function(a){return["repeating-linear-gradient(-45deg,"+a+"18 0 14px,transparent 14px 28px)","auto"]},
vbars:function(a){return["repeating-linear-gradient(90deg,"+a+"18 0 6px,transparent 6px 20px)","auto"]},
hlines:function(a){return["repeating-linear-gradient(0deg,"+a+"1f 0 3px,transparent 3px 22px)","auto"]},
glow:function(a){return["radial-gradient(circle at 20% 0%,"+a+"33,transparent 55%)","auto"]},
tri:function(a){return["linear-gradient(135deg,"+a+"14 25%,transparent 25%)","40px 40px"]}
};
P.forEach(function(x){var q=x.t.split(",");x.bg=q[0];x.ink=q[1];x.acc=q[2];x.f=q[3];x.pat=(PAT[q[4]]||PAT.grid)(q[2])});

var $=function(i){return document.getElementById(i)};
var DEF={bg:"#14161f",ink:"#f1f1f5",acc:"#ffd23f",f:"Unbounded",pat:["none","auto"]};
function esc(t){var e=document.createElement("div");e.textContent=t;return e.innerHTML}
function theme(x){
var r=document.documentElement.style,b=document.body.style;
r.setProperty("--bg",x.bg);r.setProperty("--ink",x.ink);r.setProperty("--acc",x.acc);
r.setProperty("--f",'"'+x.f+'",sans-serif');
b.backgroundImage=x.pat[0];b.backgroundSize=x.pat[1]}
function show(id,x){
["s1","s2","s3"].forEach(function(s){$(s).classList.toggle("hidden",s!==id)});
theme(x||DEF);window.scrollTo(0,0)}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}

var nick=load("nick")||"";
$("nick").value=nick;
function enter(){
var v=$("nick").value.trim();
if(!v){$("nick").focus();return}
nick=v;save("nick",v);
$("hi").textContent="Привет, "+v+"!";
show("s2")}
$("go").onclick=enter;
$("nick").onkeydown=function(e){if(e.key==="Enter")enter()};

$("grid").innerHTML=P.map(function(x,k){
return '<button class="tile" data-k="'+k+'" style="background:'+x.bg+';color:'+x.ink+';border-color:'+x.acc+'">'
+'<i>'+x.i+'</i><b style="font-family:\''+x.f+'\',sans-serif">'+esc(x.n)+'</b><span>'+esc(x.s)+'</span></button>'}).join("");

$("grid").onclick=function(e){
var b=e.target.closest(".tile");if(!b)return;
var x=P[b.dataset.k];
$("ico").textContent=x.i;
$("t").textContent=x.n;
$("d").textContent=x.d;
$("e").textContent=x.e;
$("pros").innerHTML=x.p.map(function(t){return "<li>"+esc(t)+"</li>"}).join("");
$("steps").innerHTML=x.st.map(function(t){return "<li><span>"+esc(t)+"</span></li>"}).join("");
$("know").innerHTML="<p><b>Ты должен знать:</b> "+esc(x.z)+"</p><p><b>Ты должен уметь:</b> "+esc(x.u)+"</p>";
show("s3",x)};
$("back").onclick=function(){show("s2")};
</script>
